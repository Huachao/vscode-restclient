name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Downloading VS Code from Microsoft's CDN has taken CI down twice (a
      # timeout on Sep 4, a 30-minute hang on Sep 9): with the cache,
      # test-electron finds the install and never reaches the network.
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-v1
      - run: npm ci
      - name: Build (the integration tests load dist/extension.js)
        run: npm run build
      - name: Types
        run: npx tsc -p ./ --noEmit --skipLibCheck
      - name: Unit tests
        run: npm run test:unit
      - name: Translations
        run: npm run test:l10n
      - name: Terminal runner
        run: npm run test:cli
      - name: MCP server
        run: npm run test:mcp
      - name: Integration tests (Linux needs a display)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        timeout-minutes: 12
        run: npm run test:integration
      - name: The packaged .vsix, installed and exercised
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vsix
      - name: Audit (identity, credit, privacy, deps, isolation)
        run: npm run audit
      - name: Package
        run: npx vsce package --no-dependencies -o httpkeeper.vsix
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: httpkeeper.vsix
