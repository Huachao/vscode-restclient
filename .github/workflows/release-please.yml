# The flow agreed in #6: release-please keeps a release PR built from the
# conventional titles (feat:/fix:) of what was merged; merging THAT PR creates
# the tag and the release, and this same workflow publishes.
#
# Publishing is chained here (job `publish`) instead of in release.yml because
# tags created with GITHUB_TOKEN do not trigger other workflows: a release.yml
# waiting for the tag would stay silent. release.yml remains valid for a tag
# pushed by hand (fallback).
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit
      - name: Missing secrets must fail loudly, not leave a half-made release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          missing=""
          [ -z "$VSCE_PAT" ] && missing="$missing VSCE_PAT"
          [ -z "$OVSX_PAT" ] && missing="$missing OVSX_PAT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — the release exists but cannot be published. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npx vsce package --no-dependencies -o "rest-client-${TAG}.vsix"
      - name: Marketplace (skipped if this version is already there)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VER="${TAG#v}"
          ID=$(node -p "const p=require('./package.json');p.publisher+'.'+p.name")
          if npx vsce show "$ID" --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{let j={};try{j=JSON.parse(d)||{}}catch{}process.exit((j.versions||[]).some(v=>v.version==='$VER')?0:1)})"; then
            echo "Marketplace already has $VER"
          else
            npx vsce publish --no-dependencies --packagePath "rest-client-${TAG}.vsix"
          fi
      - name: Open VSX (skipped if this version is already there)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VER="${TAG#v}"
          ID=$(node -p "const p=require('./package.json');p.publisher+'.'+p.name")
          if npx ovsx get "$ID" -v "$VER" --metadata >/dev/null 2>&1; then
            echo "Open VSX already has $VER"
          else
            npx ovsx publish "rest-client-${TAG}.vsix" -p "$OVSX_PAT"
          fi
      - name: The standalone runner, attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/cli.js httpkeeper-cli.js
          gh release upload "$TAG" "rest-client-${TAG}.vsix" httpkeeper-cli.js --clobber
